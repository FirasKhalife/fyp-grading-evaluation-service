spring:
  application:
    name: evaluation-service
  config:
    # Shared settings from config-server (fyp-grading-config). Optional: this file is complete on its own.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071}/config"
  cloud:
    config:
      fail-fast: false
    stream:
      bindings:
        activity-out-0:
          destination: assay.activity
          producer:
            required-groups: notification-service   # the queue exists before the consumer first starts
      rabbit:
        default:
          producer:
            auto-bind-dlq: true   # same queue arguments as the consumer declares (a <queue>.dlq per queue)
  mongodb:
    uri: ${DATABASE_URL:mongodb://admin:admin@localhost:27017/evaluation-db?authSource=admin}
  data:
    mongodb:
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 5s
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:7080/realms/assay}/protocol/openid-connect/certs

assay:
  clients:
    admin: http://${ADMIN_SERVICE_NAME:admin-service}
    rubric: http://${RUBRIC_SERVICE_NAME:rubric-service}

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 40   # review H5: a demo needs few threads, and each costs stack memory

eureka:
  client:
    # Register and refresh quickly: the services start together and find each other (and the config server) by name.
    initial-instance-info-replication-interval-seconds: 2
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${REGISTRY_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: "Assay evaluation service: each reviewer's filled-in rubric"
    version: ${BUILD_VERSION:dev}

springdoc:
  # Service-to-service endpoints aren't part of the public API (the gateway doesn't route them).
  paths-to-exclude: /internal/**
